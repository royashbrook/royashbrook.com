name: deploy

# build the astro site + ship it to cloudflare workers (static assets) on every push to main.
# infra/** has its own workflow (tofu/dns), so skip changes that only touch it.
# also runs daily: the build reads the `royashbrook-tool` github topic, so a newly-tagged tool shows
# up on /projects + /agents + /llms.txt within a day even with no push.
# needs repo secret CLOUDFLARE_API_TOKEN (an "Edit Cloudflare Workers" token; distinct from the
# zone-scoped TF_CLOUDFLARE_API_TOKEN). account id is in wrangler.jsonc (not a secret).
#
# GOTCHA, prebuild pulls other repos (scripts/pull-*.mjs clone + build the games): this job has NO
# github credential for OTHER repos, so a pulled repo must be PUBLIC or its clone fails and the
# script skips it (fails soft, the site still deploys, the game just goes missing). To pull a PRIVATE
# repo you'd have to add a fine-grained PAT (contents:read on that repo) as a secret and use it in the
# clone URL. Symptom to look for in this log: "WARN: <game> pull/build failed ... shipping without".
on:
  push:
    branches: [main]
    paths-ignore: ["infra/**"]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: deploy to cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
